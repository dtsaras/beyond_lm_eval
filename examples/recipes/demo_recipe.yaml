experiment_name: "blme_minimal_demo"

global:
  device: "cpu"
  output_dir: "results/demo"
  batch_size: 1
  cache_num_samples: 8
  seed: 42
  task_timeout: 120

model:
  path: "hf-internal-testing/tiny-random-gpt2"
  args: "pretrained=hf-internal-testing/tiny-random-gpt2"

tasks:
  # Small CPU-safe smoke recipe with registered BLME tasks only.
  geometry_svd:
    num_samples: 8

  geometry_isoscore:
    num_samples: 8

  interpretability_prediction_entropy:
    num_samples: 8

  consistency_calibration:
    num_samples: 8
    n_bins: 5

  dynamics_interpolation:
    num_pairs: 2
    steps: 3
    num_samples: 4
