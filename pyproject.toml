[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blme"
version = "0.2.1"
description = "Beyond LM Eval — Intrinsic diagnostics for language models"
readme = "README.md"
authors = [
  { name = "BLME Contributors" },
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# 3.10 is the real floor: numpy 2.x and transformers 5.x both require it,
# and the package uses PEP 604 annotations (`bool | None`) at import time.
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    # 5.2.0 and 5.10.2 are tested; 5.11 is not.
    "transformers>=5.2.0,<5.11",
    "numpy",
    "tqdm",
    "scipy",
    "pyyaml",
    "datasets",
    # Required, not optional: five paper-core tasks (both RepE probes,
    # mahalanobis, intrinsic_dim, categories) need it.
    "scikit-learn",
    # Pinned. dionysus 2.1.1 bundles fast_zigzag (Dey-Hou) under BSD-3-Clause,
    # which topology_zigzag_persistence needs for the paper's multi-layer
    # barcode. On glibc 2.34-2.38 an unpinned install falls through to an
    # sdist that fails to build against Boost 1.74.
    "dionysus==2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]
test = [
    # Everything the FULL test suite needs so CI can run tests/ without
    # collection errors or network-only failures.
    "pytest",
    "scikit-learn",  # probing tasks
    "ripser",        # topology tasks
    "nltk",          # diversity (Self-BLEU) tasks
    "vendi-score",   # geometry_vendi parity tests
    "nlpaug==1.1.11",  # geometry_dime augmentations
]
benchmarks = [
    "lm-eval",
]
probing = [
    "scikit-learn",
]
topology = [
    "ripser",
]
diversity = [
    # exact Texygen-parity Self-BLEU (NLTK sentence_bleu + method1 smoothing)
    "nltk",
]
sae = [
    "sae-lens",
]
augment = [
    # geometry_dime: the released code's augmentation chain; pinned because
    # the augmented text depends on this version's RNG use
    "nlpaug==1.1.11",
]
data = [
    # datasets is now a core dependency; kept for backwards compatibility
    "datasets",
]
logging = [
    "wandb",
]
all = [
    "lm-eval",
    "scikit-learn",
    "ripser",
    "sae-lens",
    "wandb",
    "datasets",
    "nltk",
    "vendi-score",
    "nlpaug==1.1.11",
]

[project.urls]
"Homepage" = "https://github.com/dtsaras/beyond_lm_eval"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blme = [
    "assets/*.json",
    "tasks/configs/*.yaml",
]

[project.scripts]
blme = "blme.cli:main"
beyond-eval = "blme.cli:main"
