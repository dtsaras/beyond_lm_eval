# Independent end-to-end reviews (read by scripts/metrics_doc.py).
#
# Each reviewer re-implemented the task's full path, from the model's forward
# pass to the reported number, without reading src/blme/tasks or tests/, using
# the papers, docs/tasks_*.md, the authors' released code and BLME's outputs
# (including _meta_ keys) only, and compared numbers on identical inputs
# (gpt2 and pythia-160m-deduped, fp32, CPU). Reports and scripts are under
# /public_data/dtsaras/hara/artifacts/pod1/blme/blind_review/<batch>/ on pod1.

batches:
  batchA:
    date: 2026-11-19
    library: fbce8b8
