# Design decisions for the evaluation tasks (read by scripts/metrics_doc.py into docs/METRICS.md).
#
# Rule used throughout (method-fidelity): the paper's or released code's protocol
# is the default; an LLM adaptation is used only where the reference cannot apply,
# and a documented rationale only where neither decides. Where several settings
# are defensible and the evidence does not pick one, the choice is a parameter
# with the reference as its default, and, when the alternative is cheap, every
# run also records it as a _meta_ key so both can be compared without a rerun.
#
# Per entry: choice, parameter (config key or null), default, alternatives,
# recorded (keys that carry the alternative in every run), why, evidence.

conventions:
  - choice: Sink rows in token clouds and pools
    default: "Drop position 0 and every token whose hidden-state norm exceeds 10x its document's median token norm at any interior depth (TOKEN_POLICY exclude_sinks)."
    why: "Massive-activation tokens carry most of the centred variance (gpt2 L6: 1% of rows hold 96% of it) and are a positional artefact, not content; non-LLM-origin metrics would otherwise measure them."
  - choice: One point per sequence
    default: "The last token of a 20-word window cut from each passage at a hashed offset; the same words for every model (points_readout: window). Whole passages are opt-in (points_readout: passage)."
    why: "Identical text across tokenizers; the last-token state is the one whose next-token distribution is defined."
  - choice: Massive activations at the last token of a window
    default: "Kept (massive_points: keep), as the references keep every point; every one-point-per-sequence cloud records _meta_window_n_massive_points and _meta_window_massive_points_max_ratio. massive_points: drop removes those windows at every depth, using the token-cloud sink rule (norm > 10x the median last-token norm at a middle depth)."
    why: "Rare but not absent: 1 of 979 windows on OLMo-1B (a window ending in '.', 54x the median) and on pythia-160m, 28 on SmolLM2-1.7B, 0 on gpt2, Llama-3.2, gemma-2/3/4, phi-2, Qwen2.5/3. One such point sets a cloud's extremal statistics: OLMo's mid_layer_max_persistence_h0_norm is 22.7 against ~1 on the other models."
  - choice: Which state 'the last layer' is
    default: "Tasks differ, and each records _meta_last_entry_is_block_output. HF's post-final-norm hidden_states[-1]: geometry_svd, the matrix_entropy headline, isoscore, magnitude, phd_dimension and cknna's last entry. The raw deepest block output: lid and intrinsic_dim (layerwise), vendi, cka, hsic, rsa and the per-layer matrix-entropy profile."
    why: "The final norm changes values a lot (gpt2 effective rank 237 post-norm vs 596 pre-norm; Llama IsoScore 0.053 vs 0.0006), so the same key name on two tasks is not the same representation. Each task follows its reference's readout where one exists."
  - choice: Where large linear algebra runs (BLME >= 0.2.1)
    default: "On the GPU when one is available: float64 SVD/eigh of large matrices, CKA's layer-pair GEMMs (float64), and the stability and unembedding kNN loops (batched, float64 chord distances, stable index tie-break). A CUDA failure recomputes on the CPU; BLME_CPU_LINALG=1 forces the CPU."
    why: "The sweep was CPU-bound with idle GPUs (stability alone was 29% of the panel's task time). A/B on the same model and run: every changed task within 3e-13 of the CPU path except stability (float32 near-ties at rank k: pythia identical, Qwen2.5-0.5B 1.4e-4) and biased CKA (the CPU path's float32 GEMMs are 1e-5..6e-5 off the exact value; the GPU path is float64-exact). Stability 280-360x and unembedding 25-50x faster. Since 0.2.2 a matrix already on the GPU falls back too (safe_svdvals), and eigvalsh_f64 sends an eigenproblem cuSOLVER 11 rejects (n >= 27,392) to BLME_EIGVALSH_HELPER before LAPACK: a crowded or older GPU stack changes only the solver, recorded in _meta_, never the quantity."
  - choice: A model's own generation_config in generation tasks (BLME >= 0.2.5)
    default: "Unset every decoding default (temperature, top_k, top_p, repetition_penalty, no_repeat_ngram_size, ...): each task samples under its own settings, recorded in _meta_ignored_generation_config. Validity fields (suppress_tokens, begin_suppress_tokens) stay applied in generation_diversity and coe (_meta_generation_validity_config); entropy_calibration and self_consistency unset them too, since they measure the full sampling distribution."
    why: "Decoding defaults differ across checkpoints and would confound comparisons (repetition_penalty 1.3 moved distinct_2 from 0.845 to 0.912). Validity fields are not a decoding preference: gemma-4-12B suppresses its <image|>/<audio|> placeholders, and without that it sampled them in 27% of positions, which the text filter then removed."
  - choice: Attention kernel
    default: "Eager whenever a co-run task needs attention weights (the study's full runs always are); recorded in the envelope as config.attn_implementation."
    why: "bf16 eager and sdpa give different logits (gemma-4-E2B mean NLL 2.2434 vs 2.2407); fp32 is identical across kernels and transformers versions."

tasks:
  dynamics_interpolation:
    - choice: Which context pairs are scored
      parameter: num_pairs
      default: "null: every distinct pair of the num_samples pool, canonical order"
      alternatives: ["an integer: that many distinct pairs from the seeded sampler"]
      recorded: [_meta_pair_selection, _meta_num_pairs_used, _meta_num_pairs_requested]
      why: "The pair sample was the estimator's only noise: 200 of 1225 pairs had a seed-to-seed sd of ~0.09 (~7% of the gap) on gpt2, and the fixed seed-42 subset gave 1.150 against 1.315 for all pairs. All pairs cost < 5 min per model at 50 passages."
  topology_betti_curve:
    - choice: Radius at which beta_1 is read (hops on the kNN graph)
      parameter: hop_radius
      default: "2.0, the released topnn_framework read (Eirene minrad=1, maxrad=2, numrad=1)"
      alternatives: ["1.0: H1 of the kNN graph's clique complex"]
      recorded: [_meta_betti_1_curve_mean_hop1, _meta_betti_1_curve_hop1, _meta_hop_radius]
      why: "Fidelity keeps the released read as the default, but on LLM last-token clouds at N = 1000 it is 0 or near 0 on every checkpoint checked (OLMo-1B 0 on all 16 layers, SmolLM2-1.7B 0.042, gpt2 0.083, pythia-160m 0), so the headline is nearly constant across models. At 1 hop beta_1 is 10-25 per layer. Naitzat et al.'s text calibrates eps* = 2.5 (5 hops), which differs from both."
  geometry_collapse:
    - choice: Blocks over which the Queipo-de-Llano valley is read
      parameter: qdl_layers
      default: "all: the minimum of the per-layer profile over every block"
      alternatives: ["interior: blocks 1..L-2"]
      recorded: [_meta_qdl_entropy_min_interior, _meta_qdl_entropy_min_interior_layer_frac, _meta_qdl_layers]
      why: "The paper's compression valley is mid-depth; pythia-160m's all-block minimum is the final pre-norm block (0.266) while its mid-depth valley is 0.80, whereas gpt2's minimum is mid-depth."
  dynamics_coe:
    - choice: The state that ends each layer chain
      parameter: chain_end
      default: "final_norm: ln_f(h_L), as the release's inference.py reads HF hidden_states"
      alternatives: ["block_output: the raw deepest block output"]
      recorded: [_meta_coe_r_blockout, _meta_coe_c_blockout, _meta_chain_end]
      why: "The release normalises by the first-to-last displacement, so a model whose last block leaves a large residual has coe_c dominated by the final norm's compression: smollm2-1.7b 1.64 at ln_f vs 0.074 at the block output (other models 0.08-0.36)."
  dynamics_sharpness:
    - choice: When the Hutchinson trace estimator stops
      parameter: hutchinson_stop
      default: "pyhessian: stop once the running mean changes by < hutchinson_tol (PyHessian trace(maxIter, tol))"
      alternatives: ["rse: stop at a relative standard error <= hutchinson_rse_target (0.05) after hutchinson_min_probes (10); n_hutchinson stays the cap"]
      recorded: [_meta_hutchinson_trace_rel_se, _meta_hutchinson_n_used, _meta_hutchinson_stop, _meta_hutchinson_pyhessian_n, _meta_hutchinson_trace_pyhessian_stop]
      why: "PyHessian's rule does not control precision: phi-2 stopped at 29 probes with a 27% relative SE and pythia-160m hit the 100-probe cap at 38%, against 0.9-7% elsewhere. An RSE run reports PyHessian's stopping point on the same probe sequence."
    - choice: ASAM normaliser
      parameter: asam_variant
      default: "invariant: T_w = |w| on every parameter, no eta (exactly invariant to function-preserving rescales)"
      alternatives: ["release: the released asam.py rule, T_w = |w| + asam_eta (0.01) on tensors named weight and T_w = 1 elsewhere"]
      recorded: [_meta_asam_sharpness_release, _meta_asam_sharpness_invariant, _meta_asam_variant]
      why: "asam_sharpness is the scale-invariant twin of sam_sharpness; the release's training rule is not scale-invariant and gives 0.01374 instead of 0.00500 on gpt2 (blind review D). Both are recorded; the cost is one perturbed forward."
    - choice: Resolution of critical_step_size
      parameter: null
      default: "Doubling from eta0, then 6 bisection steps on 'loss strictly increases' (Kalra et al. Def. 2.1); the bracket midpoint is returned"
      alternatives: []
      recorded: []
      why: "Six halvings of the factor-2 bracket resolve eta* to +-0.8%, so moving eta0 (it depends on the gradient norm) moves the result by up to that much (gpt2: 1.414 vs 1.426 after the float64-norm fix). Negligible against the cross-model spread (0.006-0.87 on the panel)."
    - choice: Sign of top_eigenvalue_estimate
      parameter: null
      default: "PyHessian's power iteration: the signed Rayleigh quotient of the eigenvalue of largest magnitude"
      alternatives: ["its absolute value, the spectral norm ||H||_2 of the last-block loss Hessian (computed by the consumer; no rerun needed)"]
      recorded: []
      why: "Away from a minimum the dominant eigenvalue can be negative. ARPACK Lanczos on the same HVP operator: gpt2-355m lambda_min -24.55 against lambda_max +4.29, phi-4 -13.09 against +10.78 (phi-2 likewise). The signed value is PyHessian's output and its sign is informative (dominant negative curvature), so it is kept; a rank-based comparison of sharpness across models should read its magnitude, as the beyond_benchmarks study does (keys.transforms)."
  geometry_intrinsic_dim:
    - choice: Static (vocabulary embedding) or layerwise (per-layer point clouds) mode
      parameter: layerwise
      default: "true: TwoNN per layer on one point per sequence (lid_first/mid/last_layer)"
      alternatives: ["false: the static vocabulary-embedding estimate (intrinsic_dimension)"]
      recorded: []
      why: "The headline keys exist only in layerwise mode, which is what the study runs; the static mode has no headline key and takes ~40 min on gpt2 on two CPU threads."
    - choice: Whether the _meta_ token cloud runs
      parameter: token_cloud
      default: "auto: only when CUDA is available"
      alternatives: ["true", "false"]
      recorded: [_meta_token_cloud]
      why: "The token cloud is a _meta_ diagnostic (TwoNN on 20000 token rows per layer): 66 s for the whole task on a GPU, but the CPU ball tree took over 42 min on gpt2 and the 600 s task_timeout discarded the headlines with it."
  geometry_lid:
    - choice: Layerwise or single-layer mode
      parameter: layerwise
      default: "true: every block output, the deepest the raw block output; lid_mean/std/max/median are the deepest layer's"
      alternatives: ["false: HF's post-norm output only (lid_first_layer and lid_mid_layer absent)"]
      recorded: [_meta_lid_mode]
      why: "Ma et al. compute LID at every layer, and the study runs layerwise. In single-layer mode lid_mean reads the post-norm output instead, so the same key changed meaning with the flag (gpt2: 7.62 single-layer vs 21.75 layerwise)."
  geometry_hubness:
    - choice: Near-duplicate rows of the 32000-row draw
      parameter: drop_near_duplicates
      default: "false: ranked like every other emittable row"
      alternatives: ["true: rows within near_duplicate_gap (1 - cos, default 1e-4) of another drawn row are dropped"]
      recorded: [_meta_n_near_duplicate_rows, "_meta_without_near_duplicates_<key> (or _meta_with_near_duplicates_<key>)"]
      why: "The emittable-row rule (id < len(tokenizer)) keeps untrained in-vocabulary rows: Llama-3's reserved tokens (290 rows within 1e-6 of another) and Qwen3's 1961 bitwise-identical never-emitted byte tokens. Dropping Llama's from the draw moves hubness_k50_skew 19.10 -> 26.19. But the nearest-neighbour gap is a continuum on other models (gemma-3: 3498 rows under 1e-4, 5144 under 1e-3) with no natural cut, so it is a parameter; the alternative costs a second ranking pass only on models that have near-duplicates."
  geometry_superposition_strength:
    - choice: Near-duplicate rows of the unembedding
      parameter: drop_near_duplicates
      default: "false: every emittable row, as the released overlap code"
      alternatives: ["true: rows within near_duplicate_gap (1 - cos) of another row are dropped first"]
      recorded: [_meta_near_duplicates_dropped, _meta_n_near_duplicate_rows]
      why: "On Llama-3.2-1B the reserved rows move superposition_ratio_centered by -4.5% when removed. The search is O(V^2 d) over the whole vocabulary, so it is opt-in and not recorded by default."
    - choice: Multimodal placeholder rows in row_norm_cv
      parameter: null
      default: "kept: they are emittable ids (id < len(tokenizer)), like every other in-vocabulary row"
      alternatives: []
      recorded: []
      why: "Gemma-3 and Gemma-4 tables are row-normalised (CV about 1e-4), so their few image and audio placeholder rows set the CV: gemma3-4b 2.64e-3 with <image_soft_token> (norm 0.005) and <end_of_image> (0.084), 1.41e-4 without; gemma4-12b likewise. These models stay two to three orders of magnitude below every other family (sweep median 0.123), so their rank against other families does not move; only the order within the Gemma rows does. A placeholder-aware filter would change every vocabulary task on these checkpoints and is not adopted (outlier review, 2026-11-20)."
  geometry_magnitude:
    - choice: Scales of the magnitude function
      parameter: null
      default: "magnipy's defaults: 30 evenly spaced scales on [0, t_conv], cosine distance; n_scales sets only the geometric ladder of the Euclidean _meta_ summary"
      alternatives: []
      recorded: []
      why: "The reference library's protocol. The docs had said the headline used n_scales: 10 (blind review C, F2); a 10-point grid gives 175.0006 / 1.1005 instead of 175.3122 / 1.1087 on gpt2."
  geometry_rsa:
    - choice: Number of tokens in the RDMs
      parameter: null
      default: "200 tokens at np.linspace positions"
      alternatives: []
      recorded: []
      why: "Open precision question for the resolvability study: over random 200-token subsets early_late is 0.213 +- 0.042 on gpt2 (BLME's fixed subset 0.154) and 0.254 +- 0.053 on pythia."
  geometry_mahalanobis:
    - choice: Unit of the fit / held-out split
      parameter: null
      default: "Whole source documents (article_id / document_id / doc_id) when the rows name them; single passages otherwise"
      alternatives: ["passage-level seeded permutation (the earlier behaviour, still used when rows carry no source)"]
      recorded: [_meta_split_unit, _meta_n_split_groups, _meta_split_groups_shared_max]
      why: "A passage-level split held out WikiText passages whose ~14 sibling passages were in the Gaussian fit. On 8 models, keeping articles whole raised the ID distance per dimension 40-93% and lowered AUROC 3-19% (phi-2 0.924 -> 0.746, below gpt2), so the leak changed rankings. Not a free choice, hence no parameter."
  geometry_perplexity:
    - choice: BOS in strided windows after the first
      parameter: ppl_window_bos
      default: "auto: when the tokenizer prepends a BOS, every window is BOS + max_length - 1 content tokens (BOS unscored context), sliding by min(stride, max_length - 1); tokenizers without a BOS are unchanged"
      alternatives: ["never: the HuggingFace GPT-2 recipe, BOS in the first window only"]
      recorded: [_meta_ppl_window_bos]
      why: "The HF strided recipe was written for GPT-2, which has no BOS. A model trained to always see its BOS first is off distribution in every later window. On the 0.2.1-0.2.4 sweep, corpus perplexity exceeded per-document perplexity by 2.7-37x on seven Gemma models (gemma-2-9b 493 vs 13.2), against 0.67-1.03x on the other 59. Restoring BOS on gemma-2-9b's later windows took them from 6.33 to 2.26 nats per token (Fable review, 2026-11-21). Every content token is still scored exactly once, with the same byte attribution."
  geometry_prediction_alignment:
    - choice: The control subtracted from the target-row cosine
      parameter: null
      default: "A deterministic frequency-matched within-document derangement"
      alternatives: ["a uniform within-document derangement (seeded)"]
      recorded: []
      why: "BLME construct; the blind review reproduced the raw cosine exactly and found plausible alternative controls move the gpt2 headline across 0.0089-0.0118 (0.0107 as shipped). Kept; flagged as a protocol choice."
  geometry_positional_decay:
    - choice: Attention rows that are constant over the kept keys
      parameter: null
      default: "Scored rho = 0 and kept in the write-weighted mean"
      alternatives: ["excluded"]
      recorded: [_meta_n_flat_attn_rows]
      why: "On pythia-160m sink heads drive many key probabilities to exactly 0 even in float64; excluding those rows moves the value by 1.1%; gpt2 has none."
  geometry_correlation_dimension:
    - choice: Where the correlation integral is evaluated
      parameter: null
      default: "At the sorted pair distances with C(d_(k)) = k/M, OLS of log C on log r in Du & Tanaka-Ishii's window 20/(N(N-1)) <= C <= 1/N"
      alternatives: ["a radius grid or midpoints (+1-2.5%)", "strict < (+2.5%)"]
      recorded: [_meta_correlation_dimension_under_resolved]
      why: "The papers do not fix it; estimates exceed the Eckmann-Ruelle bound 2 log10 N at N <= 1000 and are flagged under-resolved."
  repe_steering_effectiveness:
    - choice: Directional summary keys (steering_sign_reversal, directional_consistency, directional_success_rate)
      parameter: null
      default: "Computed from projections onto the steering direction, which are positive by construction"
      alternatives: []
      recorded: []
      why: "They sit near 1 by construction (1.0 on pythia-160m although the per-layer directional effect is negative at two layers): they check that the estimand is directional, not that steering works. Demoted to _meta_ (_meta_directional_consistency, _meta_directional_success_rate, _meta_steering_sign_reversal); read steering_concept_over_random and steering_semantic_effect instead."
  geometry_categories:
    - choice: Random-token baseline for inter-category similarity
      parameter: null
      default: "A fixed draw of 100 tokens, independent of the run seed"
      alternatives: []
      recorded: []
      why: "Exploratory task; the draw sits in the upper tail of re-draws (gpt2 one-sided p = 0.018), shifting inter by +0.002-0.012."

  geometry_effective_depth:
    - choice: What effective_depth_90 accumulates
      parameter: null
      default: "The per-block mean relative update ||h_(l+1) - h_l|| / ||h_l|| (Csordas et al., analyze_norms.py), not Block Influence"
      alternatives: []
      recorded: []
      why: "Kept; on gpt2 and pythia block 0 holds 59-69% of the total, so the headline takes only a couple of values on small models (a resolvability question for the study)."
  repe_concept_separability:
    - choice: Seed of the within-pair flips
      parameter: null
      default: "seed 42"
      alternatives: []
      recorded: []
      why: "lat_test_acc spans 0.60-0.81 over 20 seeds on gpt2 (SD 0.064): compare models at a common seed; a seed-averaged estimate is the alternative if the study needs it."
  topology_persistence_landscape:
    - choice: Subsample seed
      parameter: null
      default: "seed 42"
      alternatives: []
      recorded: []
      why: "Seed-to-seed SD of the headline ~4.5% on gpt2 (seed 42 is a low draw on the first layer): compare models at a common seed."

  # ---- Exploratory additions (2026-11-21 research memo, section 4) ----
  geometry_readout_dual_spectrum:
    - choice: Which positions enter the headline
      parameter: null
      default: "Word-final positions: token t owns a non-empty character span [s, e) with text[e-1] not whitespace and text[e] whitespace, and token t+1 starts at or after e (from the tokenizer's offsets; the next prediction begins a new word). The last token of a passage (no successor to check) and a word that ends the text (no whitespace follows) never qualify. Position 0 and massive-activation rows are excluded (TOKEN_POLICY exclude_sinks)."
      alternatives: ["every position >= 1, sinks excluded (_meta_*_all_positions)"]
      recorded: [_meta_jeffreys_dispersion_all_positions, _meta_dual_coupling_all_positions, _meta_dual_coherence_all_positions, _meta_dual_effective_rank_all_positions, _meta_dual_effective_rank_frac_all_positions, _meta_dual_tail_exponent_all_positions, _meta_word_final_share, _meta_word_final_rule]
      why: "The research memo found 0.1% of Pythia-70m/160m positions carrying 9-15% of D_J: mid-character UTF-8 byte positions (CJK, primes) with near-deterministic continuations worth 900-1,360 nats each; BLME's norm-based sink rule does not flag them. A character split across tokens gives every piece the character's span, so the next-token-start rule removes those positions by construction, for any tokenizer with offsets; the definition uses only the text, so every model is scored at the ends of the same words. On the default corpus at N = 32 d, all positions against word-final: pythia-160m-deduped D_J 8.47 vs 6.44 (-24%), gpt2 8.00 vs 7.06 (-12%). Because position 0 is excluded, a tokenizer without BOS never scores a first word that is a single token: about 0.6-0.7% of word ends (99.3-99.4% scored; blind review, 2026-11-21). A tokenizer without offsets (slow tokenizers) gets NaN headlines and _meta_word_final_reason."
    - choice: Number of rows
      parameter: points_per_dim
      default: "32: N = 32 d headline rows, passages read in corpus order until N is reached (n_rows overrides)"
      alternatives: ["any other N/d; n_rows for a fixed N (used by the invariance tests)"]
      recorded: [_meta_n_rows, _meta_n_rows_target, _meta_points_per_dim, _meta_n_target_met, _meta_n_docs_read]
      why: "The effective rank of a sample spectrum is biased low at finite N: on gpt2 the prototype gave 286, 296 and 304 at N/d = 16, 33 and 66. Pinning N/d compares every width at the same bias. 32 is the largest power of two the default corpus (1,691 passages, about 208k words, about 0.87-0.89 word-final rows per token) covers at every width of the companion study (d <= 5120 needs 164k rows); wider models are capped by the corpus and flagged, and get fewer than 32 rows per dimension. _meta_n_target_met is computed before sink removal, so it can be true while _meta_n_rows is a few rows under the target; _meta_points_per_dim counts the rows after removal."
    - choice: Sink rows in a streamed moment estimate
      parameter: null
      default: "Exact removal: rows whose middle-depth norm exceeds 2.5x the running median keep their read state; after the last passage the corpus-wide sink masks (10x the median, the library rule) are built and every accumulated sink row is recomputed from its read state and subtracted. A sink row not kept as a candidate is re-read by a second forward of its passage."
      alternatives: []
      recorded: [_meta_sink_rows_removed, _meta_sink_rows_refetched, _meta_jeffreys_dispersion_incl_sinks, _meta_jeffreys_dispersion_all_positions_incl_sinks]
      why: "The library's rule needs the corpus-wide median, which a single streaming pass does not know until the end, and the moments are too large to keep per row (N x d at d = 5120). Subtraction is exact to rounding (tests/tasks/test_readout_dual_spectrum.py against a brute-force computation, buffered and refetched paths agree to 1e-10). pythia-160m-deduped: 58 sink rows, all candidates; gpt2: none."
    - choice: The level, the coupling and the coherence of a soft-capped head
      parameter: null
      default: "D_J is computed in its logit form tr Cov(z, p) (z the softmax input), exact for any head; mu is the gradient of the log-partition, s W^T (p * sech^2(u / c)) under a final softcap; coherence is tr Cov(h, mu) / sum kappa, so it stays in (0, 1] by the Bures bound"
      alternatives: ["coherence as D_J (logit form) / sum kappa (_meta_dual_coherence_logit_level)"]
      recorded: [_meta_jeffreys_dispersion_dspace, _meta_identity_rel_gap, _meta_d_space_exact, _meta_dual_coherence_logit_level, _meta_head_form]
      why: "For an affine head (bias and logit_scale included) the two forms of D_J are the same number (gpt2 and pythia: relative gap 7e-8 and 2e-7, fp32 head) and so are the two coherences. Under a softcap (Gemma-2) only the logit form is exact and the d-dimensional spectrum is a first-order approximation; _meta_d_space_exact is false. The approximation is coarse: on gemma-2-2b (cap 30, at N = 2 d) tr Cov(h, mu) is 41% of the exact D_J, and coherence is 0.274 against 0.661 at the logit level (blind review, 2026-11-21). Exclude soft-capped models from comparisons of the kappa-based keys (dual_coupling, dual_coherence, dual_effective_rank and its _frac, dual_tail_exponent); jeffreys_dispersion (the logit form) is exact."
    - choice: Decay exponent window
      parameter: null
      default: "Ranks 11-100 of kappa (alpha-ReQ's window, the prototype's), weighted least squares with weights 1/r, truncated to the numerically nonzero kappa (above kappa_max * d * eps) when d < 101"
      alternatives: []
      recorded: [_meta_dual_tail_fit_ranks]
      why: "A fixed rank window is unchanged by zero-padding the width; the numerical-rank cut keeps exactly singular directions (a LayerNorm state lies on a hyperplane) out of the fit."
    - choice: Precision and the read state
      parameter: compute_dtype
      default: "model: the forwards in the model's dtype; the read state captured at the head's input (a forward pre-hook); the head recomputed in float32 (float64 on a float64 model), the softmax and every moment in float64; recomputed logits checked against the model's own on every passage (fail closed)"
      alternatives: ["float32: fp32 arithmetic for the forwards (fp32_compute), the refetch included"]
      recorded: [_meta_compute_dtype, _meta_original_dtype, _meta_promoted_to_fp32, _meta_head_compute_dtype, _meta_moment_dtype, _meta_head_guard_max_rel, _meta_read_state, _meta_cov_h_eig_range, _meta_cov_h_condition, _meta_cov_h_eigs_zeroed, _meta_cov_mu_eig_range, _meta_cov_mu_condition, _meta_cov_mu_eigs_zeroed, _meta_cov_condition_limit]
      why: "Measured on gpt2 at the shipped defaults: with bf16 weights, bf16 against fp32 arithmetic moved D_J 7.1428 vs 7.1456, the coupling 12.972 vs 12.979 and the effective rank 246.83 vs 246.90 (all under 0.05%), so the forwards keep the model's dtype. Rounding gpt2's fp32 checkpoint to bf16 moves D_J by +1.2% (7.061 to 7.143): that is a different function, not arithmetic noise. The identity needs the logits the head computes from the state it reads; capturing the head's input avoids assuming that HF's last hidden state is that input. The gauge invariance holds to 1e-10 through evaluate() on a float64 model. It is exact in exact arithmetic; numerically it depends on the conditioning of the re-basing. A blind review (2026-11-21, gpt2, float64) found the covariance route holding the kappa keys to about 1e-12 for dense re-basings A with cond(A) up to about 1e3, and drifting beyond about 1e4 (8e-5 relative at cond(A) = 7.7e4; 4% in sum kappa and coherence at 2e7). Diagonal gains are removed exactly at any scale by the per-coordinate balancing. The models' own bases measured are far from the limit: on gpt2 cond(Cov h) is 2.8e9, against about 6e12, where the rank tolerance (e_max d eps) starts zeroing eigenvalues. Since 0.2.7 the conditioning is recorded: _meta_cov_h_* and _meta_cov_mu_* give each balanced covariance's eigenvalue range, condition number and zeroed-eigenvalue count, against _meta_cov_condition_limit = 1 / (d eps)."
  dynamics_context_influence:
    - choice: Window length
      parameter: window
      default: "1024 tokens for every model"
      alternatives: ["a longer window for models that support one (the memo suggests 2,048-4,096)"]
      recorded: [_meta_window_tokens, _meta_window_is_configured, _meta_max_lag]
      why: "1024 is the largest context every model of the companion study supports (GPT-2's limit), so every model is measured over the same lags. The memo's 256-token prototype saw the far mass saturate by about 400M parameters within its lags; 1024 extends the lags fourfold without excluding a model. A model with a shorter context is capped and flagged."
    - choice: Which predictions are scored
      parameter: n_scored
      default: "The last 64 positions of the window (960-1023): every term reads 960+ tokens of context and only the lag varies"
      alternatives: ["every position after the replaced one (the memo's prototype and BLME before this revision)"]
      recorded: [_meta_scored_positions, _meta_n_terms_per_bin, _meta_n_terms_per_lag]
      why: "Scoring every position after s measures short lags at early positions, with little context, and long lags at late ones, so the decay mixes lag with position. On a synthetic model whose response depends on the position only (logits read the running mean of the embeddings), that design reports beta = 1.14, while scoring the end of the window gives 0.039 +- 0.034 (tests/tasks/test_context_influence.py). On gpt2 the earlier design's far mass was 0.538 against 0.276 here: a single token moves a prediction less when the prediction reads the whole window."
    - choice: Replaced positions, lags and bins
      parameter: n_replacements
      default: "16 per window. The base lag k0 = t_first - s + 1 at the first scored position (lag k = t - s + 1, k = 1 the token just read) is log-uniform on [1, 945]: one draw per equal-width stratum of log(k0) on [0, log 946), k0 = floor(exp(u)); s is never below 16. Each replacement gives the lags k0..k0 + 63; lags run to K = window - 16 = 1008; log2 bins [1], [2], [3-4], ..., [513-1008]; I per bin is the mean of the per-lag means over the bin's lags that have a term (every lag weighs the same); beta by least squares in log-log over the bins from lag 3 (bin centres the geometric mean of the bin's lags; a bin whose mean is zero is left out); far mass = sum over bins from lag 9 of bin mean x lags in the bin, i.e. the sum of the per-lag means with an empty lag filled by its bin's mean; horizon = exp(sum_b I_b w_b log c_b / sum_b I_b w_b) x the windows' mean bytes per token"
      alternatives: ["8 or 32 replacements per window (measured below)", "more windows (num_samples)"]
      recorded: [_meta_base_lag_range, _meta_base_lag_draw, _meta_n_replacements_per_window, _meta_n_forwards, _meta_lag_bins, _meta_influence_bin_means, _meta_influence_bin_means_pooled_terms, _meta_far_mass_pooled_terms, _meta_lag_empty_share, _meta_n_terms_per_bin, _meta_influence_per_lag, _meta_lag_bin_centers_tokens, _meta_lag_bin_centers_bytes, _meta_bytes_per_token, _meta_influence_horizon_tokens, _meta_influence_far_share, _meta_decay_fit_r2, _meta_influence_far_mass_se, _meta_influence_decay_exponent_se, _meta_influence_horizon_bytes_se]
      why: "Log-uniform base lags give every lag octave about the same number of replacements; stratifying within a window reaches every octave in every window (no bin is empty at the shipped settings: 151 terms in [1], 9,712 in [513-1008]). Within a bin the terms concentrate towards its lower lags (density about 1/k), so pooling a bin's terms weights its lower lags more: for a k^-1.2 profile that raises the far mass by about 5% (tests/tasks/test_context_influence.py), and on the two models the pooled far mass is 1.5% (gpt2, 0.276 vs 0.272) and 1.0% (pythia, 0.356 vs 0.353) higher; it is recorded as _meta_far_mass_pooled_terms. 0.8% of the lags have no term at the shipped settings (_meta_lag_empty_share). At 96 windows, R = 16 (1,632 forwards per model) gives far-mass bootstrap SEs of 0.018 (gpt2) and 0.020 (pythia-160m-deduped) and beta SEs of 0.031 and 0.029, the relative precision of the earlier shipped design (SE 0.031 on a far mass of 0.538). With pooled terms, R = 8 gave far-mass SEs of 0.062 and 0.059 and R = 32 gave 0.021 and 0.026: between-window variance dominates beyond 16, so more windows, not more replacements, is the lever. On the same windows, R = 16 and R = 32 differed by 0.012 and 0.048 in far mass and 0.07 and 0.02 in beta, so the bootstrap SE (heavy-tailed terms) is if anything optimistic. A blind review (2026-11-21; 3-4 seeds on two models) measured single-run far masses of about 0.27-0.31 on gpt2 and 0.34-0.38 on pythia-160m-deduped across seeds and item sets, the bootstrap SE itself varying 0.017-0.030, with the top 3 of the 96 windows carrying 29-40% of the far-lag sum. The same review found beta near -0.2 at random initialisation (a flat profile: the fixed late scoring window removes an untrained network's 1/t decay) and 1.2-1.3 after training; a small beta, or NaN, for a model whose context is cut at n tokens, since the zero bins are dropped from the fit; and a dependence on the fit's lower lag (gpt2 1.31 from lag 3, 1.11 from lag 17). For comparisons along training, the far mass or the far share (_meta_influence_far_share) is the key to read, not beta. Lag 1 here is the token just read; the base lag counted from the token before it is k0 - 1."
    - choice: Arithmetic precision of the forwards
      parameter: compute_dtype
      default: "float32: fp16/bf16 parameters and buffers are promoted for the task and restored after (fp32_compute)"
      alternatives: ["model: the model's own dtype"]
      recorded: [_meta_compute_dtype, _meta_original_dtype, _meta_promoted_to_fp32]
      why: "On the shipped design, gpt2 at R = 16, bf16 against fp32 forwards: far mass 5.56 vs 0.276 (20x), beta 0.44 vs 1.30, horizon 702 vs 17.2 bytes; from lag 33 on the bf16 bins sit at a rounding floor of about 0.005-0.006 nats against 1e-4 to 1e-3 in fp32. On the earlier all-positions design the same comparison gave gpt2 far mass 5.56 vs 0.538 and pythia-160m-deduped 140 vs 0.613, and bf16-stored weights with fp32 arithmetic (the study's path) stayed within sampling error of the fp32 checkpoints (gpt2 0.550 vs 0.538, pythia 0.612 vs 0.613). The values in bf16 are rounding noise, so fp32 arithmetic is used at every size. Cost: about 500 s for gpt2 on an idle CPU; at 34B, an estimated 1-1.5 h and about 145 GB peak allocated in fp32. Place such a model on several GPUs: Accelerate's CPU or disk offload of the weights would defeat fp32_compute (expected, not tested)."
    - choice: The causality check
      parameter: null
      default: "_meta_pre_replacement_max_js is the largest JS over the 8 positions before each replaced position, recorded and never an error; _meta_causality_ok is true when it is at most 1e-6 (CAUSALITY_TOL)"
      alternatives: []
      recorded: [_meta_pre_replacement_max_js, _meta_causality_ok, _meta_causality_tol]
      why: "A prediction cannot depend on a later token, so the value is exactly 0 on a bitwise-deterministic stack: every CPU run here gave 0.0. Non-bitwise kernels (GPU, or a CPU math library under concurrent load: one CPU replacement in 3,072 gave 1.8e-7 and 0.0 on replay) can leave rounding-level divergences, 9e-13 in the test for logits perturbed at 1e-6, far below the 1e-6 tolerance; a model that reads later tokens gives 1.8e-3 there. The flag never drops or changes a result."
    - choice: Replacement tokens and sinks
      parameter: null
      default: "u from the unigram distribution of the windows' content tokens (special tokens excluded), redrawn while equal to the original; position 0 and massive-activation tokens (the corpus-wide rule over the clean forwards) are never replaced and their predictions are not scored"
      alternatives: []
      recorded: [_meta_n_replacements, _meta_n_replacements_on_sinks, _meta_unigram_support, _meta_sink_n_massive_dropped]
      why: "Replacing a sink token removes an attention sink and moves every later prediction, an artefact of the sink, not dependence on content. The base lags are drawn before the masks are known, so the draws do not depend on the corpus-wide threshold; a draw that lands on a sink is dropped, not redrawn."
    - choice: Random streams
      parameter: seed
      default: "42; window i draws its word offset, its base lags and its replacement tokens from numpy.random.default_rng([seed, 0, i]); the bootstrap from default_rng([seed, 1])"
      alternatives: []
      recorded: [_meta_seed, _meta_draw_digest]
      why: "Window i's draws do not depend on how many windows are read, and the global RNGs are untouched. The study's seed facet adds k to every seed key (offset_seeds), which moves every stream. blme.evaluate(seed=...) does not: core fills a task config's seed only when it has none (setdefault), and the shipped defaults set seed 42, so set the task config's seed to vary the draws. Item sets 0 and 1 read different articles through the same per-window streams, so they share the base lags: common random numbers, not an independent redraw."
