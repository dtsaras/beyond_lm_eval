# ===========================================================
# BLME Default Task Configurations
# ===========================================================
# Each task name maps to its default parameters.
# These are used when no per-task config is provided in a recipe.
# Override any parameter by specifying it in your recipe YAML.
# ===========================================================

# ---- Geometry Tasks ----
geometry_svd:
  num_samples: 100
  layerwise: false

geometry_isoscore:
  # Rudman et al. warn that the point count must exceed the dimension by orders
  # of magnitude; their own validation uses 100,000 points. 100 DOCUMENTS is not
  # a point budget at all -- the realized N depends on document length, and at
  # d_model = 4096 it can fall below d. The task now also enforces a minimum
  # N/d ratio and reports the realized N, so the sampling condition is auditable
  # rather than assumed.
  num_samples: 1000
  # The paper says points should outnumber dimension by ORDERS of magnitude.
  # 10x is one order; 50x is a defensible floor at our corpus sizes, and the
  # value is NaN-gated below it rather than silently emitted.
  min_points_per_dim: 50

geometry_hubness:
  k_values: [10, 50, 100]
  batch_size: 2000

geometry_collapse:
  num_samples: 100

geometry_lid:
  k: 20
  # One point per sequence (last content token), N pinned at 1000 documents;
  # the token cloud of the first 200 (20000 rows) is _meta_.
  num_samples: 1000
  layerwise: false
  token_cloud_docs: 200
  token_cloud_points: 20000

geometry_representation_sensitivity:
  num_samples: 20

geometry_correlation_dimension:
  # One point per sequence (last content token of the whole document), N
  # pinned at 1000 documents; the mean-pooled cloud of the first 200 is _meta_.
  num_samples: 1000
  num_radii: 30
  max_points: 2000
  token_cloud_docs: 200

geometry_matrix_entropy:
  num_samples: 10

geometry_schatten:
  num_samples: 10
  # Full text, as MNN.py: null = up to the model's context.
  max_length: null

interpretability_activation_sinks:
  num_samples: 10
  max_length: 128
  sink_epsilon: 0.3
  massive_threshold_ratio: 100.0

geometry_rsa:
  num_samples: 20
  max_tokens: 200

geometry_contextualization:
  # Ethayarajh 2019 estimates both the raw measure and the anisotropy baseline
  # from 1K uniformly sampled word representations (Sec. 3.4). 200 was a speed
  # default. NOTE: values here become the task's config, so a code-level
  # `self.config.get("num_samples", N)` fallback can never fire -- this file is
  # where the effective default lives.
  num_samples: 1000
  min_word_occurrences: 5
  layers: null

geometry_lipschitz:
  num_samples: 20

geometry_perplexity:
  num_samples: 100

geometry_spectral:
  tail_fraction: 0.2  # Fraction of top singular values for Hill estimator

geometry_positional_decay:
  num_samples: 5

geometry_cka:
  num_samples: 100

geometry_unembedding:
  # Purity queries (category tokens); null = all of them. Not num_samples,
  # which the harness sets for every task.
  purity_num_queries: null
  k: 20
  categories_path: null

geometry_intrinsic_dim:
  layerwise: false
  # Layerwise mode: one point per sequence (last content token), N pinned at
  # 1000 documents for every model; the token cloud of the first 200 is _meta_.
  num_samples: 1000
  token_cloud_docs: 200

geometry_hsic:
  num_samples: 100
  max_hsic_tokens: 2000

geometry_prediction_alignment:
  num_samples: 100

geometry_categories:
  categories_path: null
  k_purity: 20
  projection_method: null

geometry_neural_collapse:
  # Wu & Papyan next-token protocol: corpus documents (the same N for every
  # model) and the minimum samples per next-token class (the paper is silent;
  # the reference's default of 1 assumes TinyStories-scale counts).
  num_samples: 1000
  min_per_class: 10
  # Sentences per topic for the _meta_topic_* proxy (bundled 5 x 8).
  n_sentences_per_topic: null

geometry_mahalanobis:
  # 2000 ID texts: a Ledoit-Wolf fit on 1000, 1000 held out and scored against
  # their own token shuffles (Q3). The corpus extends past WikiText-103
  # validation (test, then train) in a nested order: id_corpus: wikitext.
  num_samples: 2000
  id_corpus: wikitext
  ood_strategy: shuffle  # "shuffle" or "random"

geometry_weight_norms: {}

geometry_tokenizer_efficiency:
  num_samples: 20

geometry_trajectory_curvature:
  num_samples: 100
  skip_first_tokens: auto  # drop the first row only where the tokenizer prepends a BOS

geometry_mp_bulk_deviation:
  # The fixed-gamma headline needs 4d+1 tokens: 400 documents (~40k tokens)
  # cover d up to 8192. max_tokens caps only the gamma-matched _meta_ family.
  num_samples: 400
  layers: first_mid_last  # bound eigvalsh cost to 3 layers
  # REVERTED to 20000 (2026-09-06). The 32000 change was aimed at the `*_g25`
  # fixed-gamma family -- the only width-comparable one -- which needs
  # ceil(D / 0.25) = 4*D tokens and was NaN for 16 of 66 models. It did not
  # work: at `num_samples: 200` the corpus supplies only **23,272 tokens**, so
  # the cap never binds and `_meta_mp_n_tokens` reports 23272, not 32000.
  # yi1.5-34b (d=7168, needs 28,673) is STILL NaN. Meanwhile 72 of 80 columns
  # moved (gamma +14.06%) while the family it targeted moved **+0.22%** on
  # gpt2 -- an archive incompatibility across the whole task bought nothing
  # (independent Opus review, 2026-09-06).
  #
  # The right lever is the TOKEN SUPPLY (`num_samples`), or accepting the NaN
  # and documenting which models the width-comparable family covers. Raising a
  # cap above the supply is not a fix.
  max_tokens: 20000
  edge_tol: 0.05   # Tracy-Widom O(N^-2/3) finite-size buffer at the bulk edge
  fixed_gamma: 0.25  # also emit *_g25 variants at a common D/N aspect ratio

# ---- Topology Tasks ----
# The four point-cloud topology tasks read one point per sequence (its last
# token, Fay et al. 2025 / Gardinazzi et al. 2025) and use N = 1000 sequences
# for every model (Q1); at a few dozen points every summary is N-dominated.
topology_homology:
  num_samples: 1000

topology_betti_curve:
  num_samples: 1000

topology_persistence_entropy:
  num_samples: 1000

topology_persistence_landscape:
  num_samples: 1000
  # Bubenik 2015: the summaries are means over subsamples (the mean landscape).
  n_subsamples: 16
  subsample_size: 500
  n_landscapes: 5
  n_points: 200

# ---- Causality Tasks ----
causality_tracing:
  num_samples: 3
  # noise_std intentionally NOT set — leaving it unset lets the task
  # compute it from the model's own subject-token embedding σ per
  # Meng et al. 2022 §3.2 ("3 × σ(E)"). Hardcoding 0.1 here silently
  # overrode the adaptive path and made AIE incomparable across
  # architectures (v1 bug).
  # noise_std: null

causality_attention_knockout:
  num_samples: 3

causality_ablation:
  num_samples: 5
  ablation_percentages: [0.01, 0.05, 0.1, 0.25]

causality_circuit_quality:
  num_samples: 3
  top_k_pct: 25

causality_edge_attribution:
  num_samples: 10

causality_knowledge_neurons: {}

# Csordas et al. 2025, analyze_future_effects.py: 10 prompts, 4 split points
# each from range(8, T-4, 8), Python random seeded 123.
causality_layer_skip:
  num_samples: 10
  n_positions: 4
  position_seed: 123
  max_length: 512

# ---- Interpretability Tasks ----
interpretability_logit_lens:
  num_samples: 100

interpretability_attention_entropy:
  batch_size: 1
  num_samples: 100

interpretability_prediction_entropy:
  num_samples: 100

interpretability_induction_heads:
  seq_len: 30
  num_samples: 20

interpretability_sae_features:
  num_samples: 5
  sae_release: "gpt2-small-res-jb"
  sae_id: "blocks.8.hook_resid_pre"

interpretability_sparsity:
  num_samples: 5

interpretability_waa:
  num_samples: 5

interpretability_attention_effective_rank:
  num_samples: 3

interpretability_attention_rank:
  num_samples: 50

interpretability_head_roles:
  seq_len: 30
  num_samples: 20

interpretability_probing:
  num_samples: 50
  max_tokens: 128
  max_probe_samples: 5000

interpretability_attention_graph:
  num_samples: 10

interpretability_attribution:
  num_samples: 50

interpretability_superposition:
  num_samples: 5
  max_neurons: 256

# ---- Dynamics Tasks ----
dynamics_stability:
  k: 50
  num_samples: 5000
  reference_model_path: null

dynamics_sharpness:
  param_scope: last_layer
  # PyHessian's loops: at most 100 HVPs per estimator, stopping once the
  # estimate changes by less than 1e-3 (relative).
  n_hutchinson: 100
  hutchinson_tol: 0.001
  n_power_iter: 100
  power_iter_tol: 0.001
  sam_rho: 0.05
  num_samples: 4

dynamics_gradient_flow:
  num_samples: 4

dynamics_interpolation:
  # 50 -> 200. `num_pairs`, not `num_samples`, sets this estimator's noise
  # floor: the seed-to-seed sd of `convexity_gap` on gpt2 was 0.110 at 50
  # pairs, 0.060 at 200 and 0.038 at 800 (1/sqrt(n)), while changing the
  # document pool 10 -> 50 -> 200 left it at 0.110/0.110/0.106. At 50 pairs
  # the within-model seed sd (0.126) was half the between-model sd (0.268)
  # and pythia-160m vs pythia-70m ordered by coin flip (4/8 seeds).
  num_pairs: 200
  steps: 10
  num_samples: 10

dynamics_coe:
  num_samples: 5
  # Greedy generation, then the mean over the output tokens' emitting states
  # (Wang et al. 2025 Sec. 2.1); 128 is the release's setting for base models.
  max_new_tokens: 128

dynamics_generation_diversity:
  # SEED PINNED (2026-09-04). This task SAMPLES, and with no seed three runs of
  # the same model spread `mean_self_bleu` by 16.68% and
  # `sampling_entropy_collapse_delta` by 51.76%, with the between-run spread
  # only 2.0-3.2x the within-run spread -- i.e. the run-to-run noise is the
  # same order as the model-to-model signal (independent Opus review,
  # 2026-09-04). Every other sampling task in this file pins one.
  seed: 42
  # PINNED: transformers 5.2.0 silently supplies top_k=50 from the model's
  # generation config when it is not given, which truncates the sampling
  # distribution and so decides what this task measures. 0 = no top-k
  # filtering (adversarial review round 2, 2026-09-04).
  top_k: 0
  # Texygen's collection size: 500 completions over the 8 bundled prompts
  # (63 x 4 + 62 x 4); Self-BLEU scores the first 500.
  n_completions: 500
  temperature: 0.8
  max_new_tokens: 32

# ---- Consistency Tasks ----
consistency_contrastive:
  num_samples: 3

consistency_logical:
  num_samples: 5

consistency_calibration:
  num_samples: 100
  n_bins: 10
  use_cache: false

consistency_paraphrase:
  num_samples: 5

consistency_contamination:
  num_samples: 10
  k_pct: 20

consistency_knowledge_capacity:
  num_samples: 5

consistency_position_sensitivity:
  positions: [0.0, 0.25, 0.5, 0.75, 1.0]
  num_samples: 10

consistency_format_robustness:
  num_samples: 12

consistency_self_consistency:
  n_samples_per_prompt: 8
  temperature: 0.7
  max_new_tokens: 8
  num_prompts: 12

consistency_bias_weat:
  n_permutations: 500
  template: "This is {}."

consistency_membership_inference: {}

consistency_icl_slope:
  shot_counts: [0, 1, 2, 4]

# Olsson et al. 2022: NLL(token 500) - NLL(token 50) over whole-article
# contexts of at least 4096 bytes.
consistency_icl_score:
  num_samples: 2000
  max_length: 1024

# ---- Representation Engineering Tasks ----
repe_task_vectors:
  num_samples: 5

repe_concept_separability:
  num_samples: 20

repe_steering_effectiveness:
  # 3 -> 8: the bundled probe set has 8 distinct triples, and taking the
  # first 3 made the headline depend on WHICH 3 -- 12.9x swing in
  # steering_concept_over_random, and directional_consistency flipping
  # +1.0000 -> -0.2000 on the same model. See the note at `_n_take`.
  num_samples: 8
  steering_alpha: 1.0
  steering_threshold: 0.01

repe_refusal_direction:
  # true / false declares the checkpoint instruct or base; null falls back to
  # "the tokenizer has a chat template", which base Qwen2.5 tokenizers also pass.
  is_instruct: null
  # Hybrid reasoning models (Qwen3, Qwen3.5+) render the prompt with thinking
  # off (an empty think block) or on; the release predates thinking models.
  enable_thinking: false

# ---- Campaign-2 additions (2026-06): new methods, official-code parity-verified ----
geometry_vendi_score:
  # One point per sequence (last content token), N pinned at 1000 documents;
  # the token cloud of the first 200 (512 rows per layer) is _meta_.
  num_samples: 1000
  kernel: cosine
  gamma: null
  max_points: 512
  seed: 0
  token_cloud_docs: 200

geometry_phd_dimension:
  num_samples: 100
  # GPTID protocol: whole WikiText-103 articles of >= 300 tokens (train split,
  # nested order), truncated at 512 tokens, each estimated on tokens [1:-1]
  # with the notebook's adaptive grid (min 40, 7 steps, 9 subsamples per size).
  documents: long_documents
  doc_split: train
  min_doc_tokens: 300
  min_subsample: 40
  intermediate_points: 7
  text_n_points: 9
  min_text_tokens: 50
  # Pin the window: without it the code-level fallback max_length=128 fires on
  # the uncached path while the shared cache truncates at 512, so a cached and
  # an uncached run of the same model on the same corpus built DIFFERENT point
  # clouds. geometry_matrix_entropy pins 512 for exactly this reason.
  max_length: 512
  layer_idx: -1
  pooling: all_tokens
  max_points: 2000
  seed: 42
  alpha: 1.0
  n_reruns: 3
  n_points: 7
  n_points_min: 3
  min_points: 50
  phd_max_points: 512
  point_jump: 40

geometry_cknna:
  # Texts, not tokens: 1024 at k=10 is the reference protocol (platonic-rep
  # extract_features.py:178). The task bypasses a cache holding fewer docs.
  num_samples: 1024
  topk: 10
  unbiased: true
  use_cache: true

geometry_magnitude:
  # One point per sequence (last content token), N pinned at 1000 documents;
  # 100 token rows of the first 200 documents are the _meta_ token cloud.
  num_samples: 1000
  n_scales: 10
  scale_span: 10.0
  layer_idx: -1
  token_cloud_docs: 200
  token_cloud_points: 100

geometry_procrustes_linearity:
  num_samples: 100

interpretability_activation_kurtosis:
  num_samples: 100
  kurtosis_threshold: 10
  use_cache: true

topology_zigzag_persistence:
  # Gardinazzi et al. 2025 Sec. 4.1: descriptors are means over 16 subsets of
  # 500 prompts. num_samples is the pool requested (16 x 500); WikiText-103
  # validation holds 1,703 passages, so the subsets overlap (reported in
  # _meta_zz_subset_overlap).
  num_samples: 8000
  subset_size: 500
  num_subsets: 16
  # k_NN = 4, the paper's value (Gardinazzi et al. 2025 Fig. 2, Sec. 4.2).
  n_neighbors: 4
  # Loop-significance threshold of the _meta_ band proxy (a BLME choice; at
  # 0.3 no loop in a hidden-state cloud qualified). The paper has no threshold.
  persistence_frac: 0.1

interpretability_attention_rollout:
  num_samples: 10

# ---- Campaign-4 B8 additions (2026-07): gap-survey metrics ----
geometry_superposition_strength:
  max_pairs: 200000
  seed: 42

geometry_effective_depth:
  num_samples: 20
  # Prefix scored per document. 128 was hard-coded in code and moved
  # mean BI by 1.92% against a 1024-token protocol; 512 matches the
  # window the cached tasks use (adversarial review, 2026-09-04).
  max_length: 512

geometry_alpha_req:
  # One point per sequence (last content token) at the model output state,
  # N pinned at 1000 documents (Li et al. 2025 use 15000).
  num_samples: 1000
  # true adds alpha_req_per_layer / rankme_per_layer over the block outputs
  # (a second collection pass).
  profile: false

geometry_spectral_signature: {}

geometry_gride:
  # One point per sequence at every HF hidden state after the embeddings,
  # N pinned at 1000 documents (Cheng et al. use 10000).
  num_samples: 1000
  # Neighbour scale of the headline: n2 = 4 at N = 1000 is the power of two
  # nearest Cheng et al.'s n2 = 32 at N = 10000 as a fraction of the cloud.
  scale_n2: 4
  range_max: 8192

geometry_information_imbalance:
  num_samples: 1000

geometry_farms_alpha:
  # The released FARMS LLM configuration (HUST-AI-HYZ/FARMS
  # LLM_Pruning/scripts/llm_pruning_main.txt, alpha_peak_farms rows): windows of
  # r = min(num_row_samples, rows, cols) rows by int(r * q_ratio) columns on a
  # grid of at most sampling_ops_per_dim x sampling_ops_per_dim windows
  # (sampling_ops_per_dim >= 2). These set farms_alpha_mean only;
  # farms_alpha_mean_w512 always uses 512 x 512 windows on a 15 x 15 grid.
  num_row_samples: 2000
  q_ratio: 1.0
  sampling_ops_per_dim: 15

geometry_representation_dispersion:
  # yanhong-lbh/rep_dispersion scripts/run_global_dispersion.sh: 512-token
  # chunks of WikiText validation, at most 10000 (sampled with seed 42).
  chunk_len: 512
  n_chunks: 10000
  chunk_seed: 42

dynamics_fractal:
  # num_samples counts natural DOCUMENTS of >= min_doc_tokens tokens (whole
  # WikiText-103 articles from doc_split; validation has only 23 such for gpt2).
  num_samples: 100
  documents: long_documents
  doc_split: train
  min_doc_tokens: 4096
  # Pinned across models. seg_len = min(use_tokens, model context) otherwise
  # gives 1024-context models ~895 usable tokens and >=2048-context models
  # ~1919, and the Joseph exponent moves +0.021 across that split -- a
  # context-window confound correlated with model recency.
  use_tokens: 1024
  # The paper's eps (Sec. 2.2); the notebook's DEFAULT_EPS of 5e-2 is labelled
  # there as differing from the paper.
  holder_eps: 0.005

dynamics_perturbation_growth:
  num_samples: 10
  # 0.001 -> 0.01: bf16's eps is 7.812e-03, so a requested relative
  # displacement of 1e-3 was realized as only 82% of itself on bf16
  # checkpoints and 100% on fp32 ones. See the note in the task source.
  rel_eps: 0.01
  seed: 42
