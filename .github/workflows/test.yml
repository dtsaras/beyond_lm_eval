name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libboost-dev
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Prepare offline test fixtures
        env:
          # The public distilgpt2 alias serves the pinned weights over HTTP.
          # Its Xet token endpoint returns 404 for the same revision.
          HF_HUB_DISABLE_XET: "1"
        run: |
          export HF_HOME="$RUNNER_TEMP/blme-hub"
          export NLTK_DATA="$RUNNER_TEMP/blme-nltk"
          echo "HF_HOME=$HF_HOME" >> "$GITHUB_ENV"
          echo "NLTK_DATA=$NLTK_DATA" >> "$GITHUB_ENV"
          python .github/scripts/prepare_test_data.py

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        # `release` tests run in release-check.yml instead: the validation-
        # receipt freshness check fails on every commit that changes a pinned
        # input until a new receipt is recorded.
        run: |
          python -m pytest tests/ -v --tb=short -m "not release"

      - name: Check imports
        run: |
          python -c "from blme.core import evaluate; print('Core OK')"
          python -c "from blme.cli import main; print('CLI OK')"
          python -c "from blme.cache import ModelOutputCache; print('Cache OK')"
