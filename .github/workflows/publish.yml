name: Publish to PyPI

# Only a published GitHub release publishes. A tag push never does: tags run
# release-check.yml. The `pypi` environment must have required reviewers set in
# the repository settings (Settings > Environments > pypi), so every upload
# waits for an approval; PyPI's trusted publisher should name this environment.
on:
  release:
    types: [published]

permissions:
  id-token: write  # Required for trusted publishing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/blme

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check dist
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
